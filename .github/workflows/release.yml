name: Build & publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 0.6.3); otherwise derived from tag, falling back to VERSION'
        required: false
      publish:
        description: 'If false, skip upload + CF purge (PR / dry-run validation)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # cosign keyless via GitHub OIDC

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(tr -d '[:space:]' < VERSION)
          fi
          # Stable releases only (pre-releases look like 0.5.0_pre4 or 0.3.1~pre1).
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not a stable CirrOS release (e.g. 0.6.3)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$v"

  build:
    needs: resolve-version
    name: Build
    uses: open-img-cloud/.github/.github/workflows/build-libguestfs-image.yml@main
    with:
      os_name: cirros
      version: ${{ needs.resolve-version.outputs.version }}
      output_filename: 'cirros-{version}-x86_64.qcow2'
      upstream_url: 'https://download.cirros-cloud.net/{version}/cirros-{version}-x86_64-disk.img'
      upstream_checksum_url: 'https://download.cirros-cloud.net/{version}/SHA256SUMS'
      decompress: none
      # CirrOS is republished UNCHANGED, this is the whole point of the image.
      # passthrough: no customize script, no cloud-init drop-in, no
      # virt-sysprep, no virt-sparsify; the build fails unless the published
      # qcow2 has exactly the SHA-256 listed in the upstream SHA256SUMS.
      # (libguestfs could not modify it anyway: the root partition only holds
      # the kernel and initramfs until the first boot copies the system onto
      # it, so virt-customize and virt-sysprep find no operating system.)
      passthrough: true
      # contract: minimal (no cloud-init, no qemu-guest-agent, password login
      # kept on purpose). The smokes log in as `cirros` with the key that
      # cirros-ds installs from the metadata (config drive or EC2 metadata
      # service), then check DNS, hostname, root growth, sudo and IPv6.
      # Both inputs come from open-img-cloud/.github (PR 55).
      contract: minimal
      runtime_smoke_login_user: cirros
      publish: ${{ inputs.publish == true || github.event_name == 'push' }}
      sync_latest: true
    secrets: inherit
